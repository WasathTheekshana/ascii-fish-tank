name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install .
      - run: ascii-fish-tank --version
      - run: ascii-fish-tank --snapshot --no-color

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh packaging/build-deb.sh
      - run: sudo apt-get install -y ./dist/ascii-fish-tank.deb
      - run: ascii-fish-tank --version
      - run: ascii-fish-tank --snapshot --no-color

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build --print-build-logs
      - run: ./result/bin/ascii-fish-tank --snapshot --no-color
      - run: nix flake check
