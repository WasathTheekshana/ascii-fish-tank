[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-fish-tank"
dynamic = ["version"]
description = "ASCII fish tank for the terminal, with an optional clock"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Wasath Theekshana" }]
keywords = ["ascii", "terminal", "aquarium", "screensaver"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/WasathTheekshana/ascii-fish-tank"
Issues = "https://github.com/WasathTheekshana/ascii-fish-tank/issues"

[project.scripts]
ascii-fish-tank = "ascii_fish_tank:main"

[tool.setuptools]
py-modules = ["ascii_fish_tank"]

[tool.setuptools.dynamic]
version = { attr = "ascii_fish_tank.VERSION" }
